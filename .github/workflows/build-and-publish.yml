name: Build and publish

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - nginx/**
      - scripts/**
      - commet-signing-key.asc
      - .github/workflows/build-and-publish.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      commet_version:
        description: "Upstream Commet release tag (for example v0.5.1). Leave empty for latest release."
        required: false
        type: string
      force_rebuild:
        description: "Rebuild and push even if VERSION already matches the target tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: commet-unraid

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream release tag
        id: release
        env:
          INPUT_VERSION: ${{ github.event.inputs.commet_version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            TAG="${INPUT_VERSION}"
          else
            TAG=$(curl -fsSL https://api.github.com/repos/commetchat/commet/releases/latest | jq -r '.tag_name')
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to resolve Commet release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve GHCR image namespace
        id: ghcr
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: plan
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FORCE: ${{ github.event.inputs.force_rebuild }}
        run: |
          set -euo pipefail
          PACKAGED=$(tr -d ' \n\r' < VERSION)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            if [ "$PACKAGED" != "$TAG" ]; then
              echo "bump_version=true" >> "$GITHUB_OUTPUT"
            else
              echo "bump_version=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$FORCE" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "bump_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PACKAGED" = "$TAG" ]; then
            echo "Packaged version $PACKAGED matches upstream; skipping scheduled build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "bump_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "bump_version=true" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.plan.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.plan.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMMET_VERSION=${{ steps.release.outputs.tag }}
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
            ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}

      - name: Update VERSION and Unraid template
        if: steps.plan.outputs.should_build == 'true' && steps.plan.outputs.bump_version == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAG" > VERSION
          sed -i "s|<Tag>.*</Tag>|<Tag>${TAG}</Tag>|" unraid/commet-unraid.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION unraid/commet-unraid.xml
          git diff --staged --quiet && exit 0
          git commit -m "chore: bump packaged Commet to ${TAG} [skip ci]"
          git push
