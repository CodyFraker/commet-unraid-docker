services:
  commet:
    build:
      context: .
      args:
        COMMET_VERSION: ${COMMET_VERSION:-v0.5.1}
    image: ghcr.io/${GITHUB_OWNER:-codyfraker}/commet-unraid:${COMMET_VERSION:-latest}
    ports:
      - "${HOST_PORT:-8080}:80"
      - "${HOST_HTTPS_PORT:-8443}:443"
    environment:
      DEFAULT_HOMESERVER: ${DEFAULT_HOMESERVER:-}
      TLS_SELF_SIGNED: ${TLS_SELF_SIGNED:-false}
      TLS_HOSTNAME: ${TLS_HOSTNAME:-commet.local}
      TLS_PUBLIC_PORT: ${TLS_PUBLIC_PORT:-8443}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/etc/nginx/ssl/cert.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/etc/nginx/ssl/key.pem}
    volumes:
      - ${SSL_VOLUME:-commet-ssl}:/etc/nginx/ssl
    restart: unless-stopped

volumes:
  commet-ssl:
